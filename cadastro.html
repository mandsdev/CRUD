<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
     <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <a href="index.html">Home</a>

    <form id="formcadastro">
        <input type="text" id="nome" placeholder="Nome Completo" required>
        <input type="text" id="cpf" placeholder="CPF(000.000.000-00)" maxlength="14" required>
        <input type="email" id="email" placeholder="E-mail (nome@dominio.com)" required>
        <input type="text" id="celular" placeholder="Celular ((00) 00000-0000)" maxlength="15"  required>
        <input type="text" id="cep" placeholder="CEP (00000-000)" maxlength="9" required>
        <button type="submit">Cadastrar</button>
    </form>

   
    <script src="script.js"></script>
</body>
</html>
